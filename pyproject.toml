[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-mexc-intelligence"
version = "1.0.0"
description = "Independent MEXC USDT-M Futures forecasting and quantitative research platform"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary application; third-party notices are in THIRD_PARTY_NOTICES.md"}
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.40.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.14.1",
  "SQLAlchemy==2.0.50",
  "psycopg[binary]==3.2.13",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "itsdangerous==2.2.0",
  "websockets==16.0",
  "orjson==3.11.4",
  "python-multipart==0.0.20",
  "PyYAML==6.0.3",
  "alembic==1.17.1",
]

[project.optional-dependencies]
inference = [
  "torch>=2.2,<3",
  "einops==0.8.1",
  "huggingface_hub==0.33.1",
  "safetensors==0.6.2",
  "tqdm==4.67.1",
]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.4", "mypy==1.18.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
