name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check app tests scripts
      - run: python -m compileall -q app scripts
      - run: python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.web -t kronos-mexc-web .
      - run: docker build -f Dockerfile.market -t kronos-mexc-market .
      # This build installs upstream Kronos and model runtime dependencies, but model weights are downloaded on first inference.
      - run: docker build -f Dockerfile.compute -t kronos-mexc-compute .
