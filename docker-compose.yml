services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rslr
      POSTGRES_USER: rslr
      POSTGRES_PASSWORD: rslr_local_only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rslr"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rslr:rslr_local_only@db:5432/rslr
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "rslr.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rslr:rslr_local_only@db:5432/rslr
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
