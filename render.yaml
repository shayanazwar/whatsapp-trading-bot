services:
  - type: web
    name: kronos-mexc-intelligence-web
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-mexc-intelligence-db
          property: connectionString
      - key: AUTO_SCAN_ENABLED
        value: "false"
      - key: PAPER_MODE
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTOMATIC_ORDER_EXECUTION
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ALLOWED_RECIPIENTS
        sync: false
      - key: WHATSAPP_DEFAULT_RECIPIENT
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  - type: worker
    name: kronos-mexc-intelligence-market
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.market
    dockerCommand: sh -c 'python -m app.migration_lock && python -m app.worker --role market' 
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: APP_SECRET_KEY
      - key: ADMIN_USERNAME
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_USERNAME
      - key: ADMIN_PASSWORD
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_PASSWORD
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-mexc-intelligence-db
          property: connectionString
      - key: WHATSAPP_ENABLED
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: WHATSAPP_ENABLED
      - key: META_ACCESS_TOKEN
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_ACCESS_TOKEN
      - key: META_PHONE_NUMBER_ID
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_PHONE_NUMBER_ID
      - key: AUTO_SCAN_ENABLED
        value: "true"
      - key: PAPER_MODE
        value: "true"

  - type: worker
    name: kronos-mexc-intelligence-compute
    runtime: docker
    plan: 2c-4g
    region: frankfurt
    dockerfilePath: ./Dockerfile.compute
    dockerCommand: sh -c 'python -m app.migration_lock && python -m app.worker --role compute' 
    autoDeploy: true
    disk:
      name: kronos-model-cache
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: APP_SECRET_KEY
      - key: ADMIN_USERNAME
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_USERNAME
      - key: ADMIN_PASSWORD
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_PASSWORD
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-mexc-intelligence-db
          property: connectionString
      - key: WHATSAPP_ENABLED
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: WHATSAPP_ENABLED
      - key: META_ACCESS_TOKEN
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_ACCESS_TOKEN
      - key: META_PHONE_NUMBER_ID
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_PHONE_NUMBER_ID
      - key: HF_HOME
        value: /var/data/huggingface
      - key: FORECAST_SAMPLE_COUNT
        value: "1000"
      - key: FORECAST_HORIZON
        value: "24"
      - key: PAPER_MODE
        value: "true"


  - type: worker
    name: kronos-mexc-intelligence-inference
    runtime: docker
    plan: 2c-4g
    region: frankfurt
    dockerfilePath: ./Dockerfile.compute
    dockerCommand: sh -c 'python -m app.migration_lock && python -m app.worker --role inference'
    autoDeploy: true
    disk:
      name: kronos-inference-model-cache
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: APP_SECRET_KEY
      - key: ADMIN_USERNAME
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_USERNAME
      - key: ADMIN_PASSWORD
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: ADMIN_PASSWORD
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-mexc-intelligence-db
          property: connectionString
      - key: WHATSAPP_ENABLED
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: WHATSAPP_ENABLED
      - key: META_ACCESS_TOKEN
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_ACCESS_TOKEN
      - key: META_PHONE_NUMBER_ID
        fromService:
          type: web
          name: kronos-mexc-intelligence-web
          envVarKey: META_PHONE_NUMBER_ID
      - key: HF_HOME
        value: /var/data/huggingface
      - key: FORECAST_DEVICE
        value: cpu
      - key: FORECAST_SAMPLE_COUNT
        value: "1000"
      - key: FORECAST_HORIZON
        value: "24"
      - key: PAPER_MODE
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTOMATIC_ORDER_EXECUTION
        value: "false"

databases:
  - name: kronos-mexc-intelligence-db
    plan: 0.5c-1g
    region: frankfurt
    databaseName: kronos_intelligence
    user: kronos_intelligence
    postgresMajorVersion: "17"
    ipAllowList: []
