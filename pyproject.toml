[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rslr-trading-bot"
version = "0.1.0"
description = "RSLR MEXC USDT-M Futures signal and backtesting system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.5,<1"]

[project.scripts]
rslr = "rslr.cli:main"

[tool.setuptools.packages.find]
include = ["rslr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
