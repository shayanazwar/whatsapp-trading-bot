# Render Blueprint: split responsive WhatsApp/web traffic from the long-running scanner worker.
# Live execution is disabled and no order-placement loop is started by this worker.
databases:
  - name: mexc-rsi-ema-db
    databaseName: mexc_rsi_ema
    user: mexc_rsi_ema
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: mexc-rsi-ema-web
    runtime: docker
    region: singapore
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars: &commonEnv
      - key: APP_ROLE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: mexc-rsi-ema-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/mexc_bot.sqlite3
      - key: MEXC_REST_BASE_URL
        value: https://api.mexc.com
      - key: MEXC_PRICE_SERIES
        value: standard
      - key: MEXC_UNIVERSE_TOP_N
        value: "100"
      - key: MEXC_UNIVERSE_SCAN_ENABLED
        value: "true"
      - key: SIGNAL_PUSH_ENABLED
        value: "true"
      - key: SIGNAL_TTL_BARS
        value: "2"
      - key: CANDIDATE_STOP_ATR_MULTIPLE
        value: "1.5"
      - key: CANDIDATE_TARGET_ATR_MULTIPLE
        value: "2.5"
      - key: CANDIDATE_MIN_NET_RR
        value: "1.2"
      - key: BACKTEST_MIN_COVERAGE_PCT
        value: "98"
      - key: BACKTEST_MIN_UNIVERSE_COVERAGE_PCT
        value: "90"
      - key: RISK_PER_TRADE_FRACTION
        value: "0.005"
      - key: BACKTEST_MAX_POSITIONS
        value: "50"
      - key: BACKTEST_MAX_OPEN_RISK_FRACTION
        value: "0.25"
      - key: MAX_CONCURRENT_POSITIONS
        value: "1"
      - key: MTF_HTF_WARMUP_BARS
        value: "250"
      - key: LIVE_MAX_SPREAD_ATR_FRACTION
        value: "0.10"
      - key: LIVE_MIN_ORDERBOOK_DEPTH_USDT
        value: "250"
      - key: MAX_ADVERSE_FUNDING_RATE
        value: "0.0005"
      - key: DEFAULT_STARTING_BALANCE
        value: "100"
      - key: INITIAL_MARGIN_USDT
        value: "1"
      - key: MAX_LEVERAGE
        value: "50"
      - key: NET_TAKE_PROFIT_USDT
        value: "0.30"
      - key: REQUESTED_STOP_LOSS_USDT
        value: "3.00"
      - key: BACKTEST_MARGIN_MODE
        value: cross
      - key: BACKTEST_MAX_HOLDING_MINUTES
        value: "1440"
      - key: RSI_OVERSOLD
        value: "30"
      - key: DEFAULT_SYMBOLS
        value: BTC_USDT,ETH_USDT,SOL_USDT
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: BACKTEST_JOB_POLL_SECONDS
        value: "5"
      - key: PAPER_TRADING_ENABLED
        value: "false"
      - key: DATA_ALIGNMENT_PROBE_APPROVED
        value: "false"
      - key: AUTO_TRADING_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_BUILD_RELEASED
        value: "false"
      - key: WHATSAPP_CRYPTO_MESSAGING_ALLOWED
        value: "false"
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ALLOWED_SENDERS
        sync: false
      - key: WHATSAPP_POLICY_CLEARANCE_REF
        sync: false
      - key: WEB_API_TOKEN
        generateValue: true

  - type: worker
    name: mexc-rsi-ema-scanner
    runtime: docker
    region: singapore
    dockerCommand: python -m app.worker
    disk:
      name: mexc-market-archive
      mountPath: /var/data
      sizeGB: 10
    envVars: *commonEnv
