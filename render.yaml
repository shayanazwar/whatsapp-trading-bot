services:
  - type: web
    name: mexc-futures-research-bot
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: mexc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/mexc_bot.sqlite3
      - key: REPORTS_DIR
        value: /var/data/reports
      - key: MEXC_REST_BASE_URL
        value: https://api.mexc.com
      - key: MEXC_PRICE_SERIES
        value: real
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: PAPER_TRADING_ENABLED
        value: "false"
      - key: DATA_ALIGNMENT_PROBE_APPROVED
        value: "false"
      - key: AUTO_TRADING_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_BUILD_RELEASED
        value: "false"
      - key: WHATSAPP_CRYPTO_MESSAGING_ALLOWED
        value: "false"
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ALLOWED_SENDERS
        sync: false
      - key: WHATSAPP_POLICY_CLEARANCE_REF
        sync: false
